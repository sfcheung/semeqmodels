url: https://sfcheung.github.io/semeqmodels/
template:
  bootstrap: 5
  bootswatch: pulse
  theme: a11y-light
  bslib:
    # pkgdown-nav-height: 100px
    bg: "#EFEFEF"
    fg: "#000000"
    primary: "#8F0E98"
    link-color: "#0000A0"
    base_font: {google: "Nunito Sans"}
    heading_font: {google: "Nunito Sans"}
    code_font: {google: "Cousine"}
  includes:
    in_header: <meta name="google-site-verification" content="0VLBmFnW_UJFI-7gXnORPBsWxqZwmzuGpK-TeVRLBjQ" />
figures:
  fig.width: 6
  fig.height: 4
  fig.asp: 0.75

navbar:
  bg: primary
  structure:
    left:  [intro, articles, reference, tutorials, news]
    right: [search, github]

articles:

- title: Get Started
  navbar: Get Started
  contents:
  - semeqmodels

# - title: Examples
#   navbar: Examples
#   contents:
#   - three_observed_variables

reference:
- title: Main Functions
  desc:  >
    All-in-one functions for
    common tasks.
- contents:
  - eq_models
  - eq_df_models
- title: Helpers for Models
  desc:  >
    Helpers for working with parameter tables (models)
- contents:
  - model_diff
  - modified_models
  - partable_select
- title: Plotting Models
  desc:  >
    Plotting a list of parameter tables (models)
- contents:
  - plot_partables
- title: Other Helpers
  desc:  >
    Helpers for advanced tasks
- contents:
  - eq_partables_helpers
  - digest_partable
  - partable_helpers
  - auto_curve_covariance

- title: Datasets
  desc:  >
    Datasets used in examples.
- contents:
  - has_keyword("datasets")

